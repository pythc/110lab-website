name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release
      - run: node scripts/verify-recruitment-release.mjs
      - run: node scripts/archive-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: 110lab-website-release
          path: artifacts/deployment/110lab-*.tar.gz
          retention-days: 14
