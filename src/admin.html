<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>动态管理 · 110lab</title><style>/* ADMIN_CSS */</style></head>
<body>
<header class="admin-header"><a class="brand" href="/">110<span>lab</span></a><span class="admin-label">动态管理</span><nav><a href="https://110-lab.cn/#updates" target="_blank" rel="noopener noreferrer">查看官网</a><button id="logout" hidden>退出登录</button></nav></header>
<main>
<section id="login-panel" class="login-panel" aria-labelledby="login-title"><p class="eyebrow">110 实验室</p><h1 id="login-title">管理员登录</h1><form id="login-form"><p>使用实验室管理员身份维护官网动态</p><button class="primary" type="submit">飞书登录</button></form></section>
<section id="manager" class="manager" hidden>
<aside class="updates-list"><div class="list-heading"><h1>实验室动态</h1><button id="new-update" class="small-primary">新建</button></div><p id="list-empty" class="muted" hidden>还没有动态 从第一条开始</p><ul id="draft-list"></ul></aside>
<section class="editor-panel" aria-labelledby="editor-title"><div class="editor-heading"><h2 id="editor-title">新建动态</h2><span id="draft-state" class="state">未保存</span></div>
<form id="editor-form"><label>标题<input name="title" maxlength="120" required placeholder="给动态一个清楚的标题"></label><label>简介<textarea name="summary" maxlength="280" rows="2" placeholder="展示在官网卡片中的简述"></textarea></label><label>正文<textarea name="body" rows="12" maxlength="16000" placeholder="记录项目进展、活动或值得分享的成果"></textarea></label><p class="format-note">支持 ## 标题、- 列表、**加粗** 和 [文字](https://链接)</p><label>相关链接 <span class="muted">可选</span><input name="link" type="url" maxlength="1000" placeholder="https://"></label><div class="editor-actions"><button class="primary" type="submit">保存草稿</button><button id="preview-update" type="button" disabled>预览与发布</button><button id="withdraw-update" type="button" class="danger" hidden>撤回</button></div></form>
<p class="editor-note">保存草稿不会改变官网 已发布内容需要再次发布才会更新</p>
</section></section>
<p id="admin-status" role="status" aria-live="polite"></p>
</main>
<dialog id="publish-dialog"><form method="dialog" class="dialog-close"><button aria-label="关闭预览">关闭</button></form><p class="eyebrow">发布预览</p><h2>确认公开内容</h2><p class="muted">以下内容将展示在 110 实验室官网</p><div id="public-preview"></div><label class="confirmation"><input id="confirm-public" type="checkbox">我确认这条动态适合公开展示</label><div class="dialog-actions"><button id="publish-update" class="primary" disabled>确认发布</button></div></dialog>
<dialog id="withdraw-dialog"><form method="dialog" class="dialog-close"><button aria-label="取消撤回">取消</button></form><h2>撤回这条动态</h2><p>官网将不再展示这条内容 草稿仍会保留</p><button id="confirm-withdraw" class="danger">确认撤回</button></dialog>
<script type="module">/* ADMIN_SCRIPT */</script></body></html>
