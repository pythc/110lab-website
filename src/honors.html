<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>奖项荣誉 · 110lab</title>
    <style>
      /* HONORS_CSS */
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="/workbench">110lab</a><span>奖项荣誉</span
      ><a class="back" href="/workbench">工作台</a>
    </header>
    <main>
      <section class="panel">
        <div class="heading">
          <div>
            <p class="eyebrow">LAB ACHIEVEMENTS</p>
            <h1>奖项荣誉</h1>
            <p class="intro">记录每一份努力的成果</p>
          </div>
          <div class="identity">
            <span id="identity">未登录</span><button id="login">飞书登录</button
            ><button id="logout" hidden>退出</button>
          </div>
        </div>
        <p id="notice" role="status" hidden></p>
        <div id="signed-out" class="empty">
          <h2>实验室的共同成果</h2>
          <p>登录后登记你的奖项 查看已审核的荣誉</p>
        </div>
        <div id="content" hidden>
          <div class="toolbar">
            <nav aria-label="荣誉分类" id="tabs">
              <button data-tab="approved" aria-pressed="true">
                荣誉档案 <span id="count-approved">0</span></button
              ><button data-tab="mine" aria-pressed="false">
                我的登记 <span id="count-mine">0</span></button
              ><button
                data-tab="review"
                id="review-tab"
                aria-pressed="false"
                hidden
              >
                待审核 <span id="count-review">0</span></button
              ><button
                data-tab="archive"
                id="archive-tab"
                aria-pressed="false"
                hidden
              >
                已归档
              </button>
            </nav>
            <button class="primary" id="new">登记荣誉</button>
          </div>
          <div class="filters">
            <input
              id="search"
              type="search"
              placeholder="搜索奖项 项目或成员"
              aria-label="搜索荣誉"
            /><select id="level-filter" aria-label="筛选级别">
              <option value="">全部级别</option></select
            ><button id="refresh">刷新</button><span id="result-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">奖项 / 荣誉</th>
                  <th scope="col">级别与等次</th>
                  <th scope="col">获奖成员</th>
                  <th scope="col">获奖日期</th>
                  <th scope="col">状态</th>
                  <th scope="col"><span class="sr-only">操作</span></th>
                </tr>
              </thead>
              <tbody id="records"></tbody>
            </table>
          </div>
          <div id="empty" class="empty" hidden>
            <h2>还没有荣誉记录</h2>
            <p>登记奖项与获奖成员 提交管理员审核</p>
          </div>
        </div>
      </section>
    </main>
    <dialog id="editor">
      <form id="form">
        <div class="dialog-heading">
          <h2 id="editor-title">登记荣誉</h2>
          <button type="button" data-close="editor">关闭</button>
        </div>
        <div class="form-body">
          <p class="form-hint">保存为草稿后可上传证书 完成后提交审核</p>
          <div class="form-grid">
            <label class="wide"
              >奖项或荣誉名称<input
                name="name"
                maxlength="160"
                required
                placeholder="如 中国大学生计算机设计大赛" /></label
            ><label class="wide"
              >主办单位<input name="organizer" maxlength="160" required
            /></label>
            <label
              >级别<select
                name="level"
                id="form-level"
                required
              ></select></label
            ><label
              >获奖等次<input
                name="prize"
                required
                maxlength="80"
                placeholder="如 一等奖 / 优秀奖" /></label
            ><label class="wide" id="level-note-label" hidden
              >级别说明<input name="levelNote" maxlength="80" /></label
            ><label
              >获奖日期<input
                name="awardedAt"
                type="date"
                required
                min="2000-01-01"
                max="2100-12-31" /></label
            ><label
              >关联项目<select name="projectId" id="form-project">
                <option value="">不关联项目</option>
              </select></label
            >
          </div>
          <fieldset>
            <legend>获奖成员</legend>
            <input
              id="member-search"
              type="search"
              placeholder="搜索成员姓名"
              aria-label="搜索获奖成员"
            />
            <div id="members" class="member-list"></div>
            <p class="form-hint" id="members-hint">
              提交者本人保留在获奖成员中
            </p>
          </fieldset>
          <label
            >补充说明<textarea
              name="description"
              rows="3"
              maxlength="3000"
              placeholder="参赛作品 获奖背景或其他说明"
            ></textarea>
          </label>
          <p id="form-error" class="error" role="alert" hidden></p>
        </div>
        <div class="dialog-footer">
          <button type="button" data-close="editor">取消</button
          ><button type="submit" class="primary">保存草稿</button>
        </div>
      </form>
    </dialog>
    <dialog id="detail">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">HONOR RECORD</p>
          <h2 id="detail-title"></h2>
        </div>
        <button type="button" data-close="detail">关闭</button>
      </div>
      <div class="form-body">
        <div id="detail-body"></div>
        <section class="certificate">
          <h3>证书附件</h3>
          <div id="certificate-info"></div>
          <form id="upload-form" hidden>
            <label for="certificate">上传或替换证书</label
            ><input
              id="certificate"
              type="file"
              accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"
              required
            />
            <p class="form-hint">一份 PDF PNG 或 JPG 最大 5MB</p>
            <button type="submit">上传证书</button>
          </form>
        </section>
        <div id="review-note-wrap" hidden>
          <label
            >审核意见<textarea
              id="review-note"
              rows="2"
              maxlength="2000"
              placeholder="退回时请说明需要补充的内容"
            ></textarea>
          </label>
        </div>
        <p id="detail-error" class="error" role="alert" hidden></p>
        <section class="history">
          <h3>操作记录</h3>
          <ol id="history"></ol>
        </section>
      </div>
      <div id="detail-actions" class="dialog-footer"></div>
    </dialog>
    <script type="module">
      /* HONORS_SCRIPT */
    </script>
  </body>
</html>
